# Python CI Pipeline - Sistem Perpustakaan
name: Python CI Pipeline - Sistem Perpustakaan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Mengambil Kode dari Repository
        uses: actions/checkout@v4

      - name: Menyiapkan Lingkungan Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Menginstal Dependensi Proyek
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Memeriksa Kualitas Kode (Flake8)
        run: |
          flake8 models/ controllers/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Menjalankan Automated Unit Testing (pytest)
        run: |
          python -m pytest -v

# Jalankan ketika ada push atau pull request ke branch main
